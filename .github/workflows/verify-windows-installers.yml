name: Verify Windows installers

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful Windows Release run to verify
        required: true
      version:
        description: Backboard release version
        required: true
        default: '3.1.5'

permissions:
  contents: read
  actions: read

jobs:
  install-uninstall:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Parse installer test script
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'scripts/windows-release/Test-Installers.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
      - name: Download successful signed release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:RELEASE_RUN_ID -notmatch '^\d+$' -or $env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release inputs' }
          $run = gh run view $env:RELEASE_RUN_ID --json conclusion,workflowName | ConvertFrom-Json
          if ($run.conclusion -ne 'success' -or $run.workflowName -ne 'Windows Release') { throw 'Expected successful Windows Release run' }
          gh run download $env:RELEASE_RUN_ID -n "Backboard-Studio-$env:RELEASE_VERSION-windows-x64-signed" -D release
      - name: Verify fresh installs and uninstall registration
        shell: pwsh
        run: ./scripts/windows-release/Test-Installers.ps1 -ReleasePath release -Version $env:RELEASE_VERSION
      - name: Preserve installer test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Windows-installer-verification-${{ inputs.version }}
          path: installer-test-results/
          if-no-files-found: warn
          retention-days: 30
