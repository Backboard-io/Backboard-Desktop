<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220">
  <rect width="1600" height="1220" fill="#F4F1EA"/>
  <style>
    .card { fill: #FBF9F4; stroke: #DDD7CB; stroke-width: 2; }
    .title { fill: #171717; font: 600 32px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: -0.025em; }
    .meta { fill: #918C82; font: 600 15px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 0.16em; }
    .label { fill: #918C82; font: 600 14px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 0.14em; }
    .word { fill: #171717; font: 560 62px "Avenir Next", Avenir, "Helvetica Neue", sans-serif; letter-spacing: -0.055em; }
    .word-rev { fill: #F4F1EA; font: 560 40px "Avenir Next", Avenir, "Helvetica Neue", sans-serif; letter-spacing: -0.055em; }
    .caps { fill: #171717; font: 620 50px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 0.065em; }
  </style>

  <defs>
    <g id="lower-b-core" fill="none" stroke="currentColor" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
      <path d="M34 14V146"/>
      <path d="M35 62H93C116 62 130 76 130 99C130 122 116 136 93 136H61"/>
      <rect x="82" y="86" width="27" height="27" rx="8" fill="#6D5EFF" stroke="none"/>
    </g>

    <g id="orbit-b-core" fill="none" stroke="currentColor" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
      <path d="M34 14V146"/>
      <path d="M35 99A47 47 0 1 0 82 52"/>
      <rect x="77" y="88" width="23" height="23" rx="7" fill="#6D5EFF" stroke="none"/>
    </g>

    <g id="core-punctuation">
      <rect x="31" y="31" width="98" height="98" rx="31" fill="currentColor"/>
      <rect x="66" y="66" width="28" height="28" rx="8" fill="#6D5EFF"/>
    </g>
  </defs>

  <text x="70" y="72" class="title">Backboard clean finalists</text>
  <text x="70" y="106" class="meta">LOWERCASE PROPORTION · ONE MEMORY-CORE ACCENT · ROUND 09</text>
  <line x1="70" y1="145" x2="1530" y2="145" stroke="#D6D0C4" stroke-width="2"/>

  <!-- A -->
  <g transform="translate(70 190)">
    <rect width="1460" height="290" rx="32" class="card"/>
    <text x="30" y="47" class="label">A · LOWERCASE CORE B</text>
    <g transform="translate(85 62)" style="color:#171717"><use href="#lower-b-core"/></g>
    <text x="298" y="179" class="word">Backboard</text>
    <g transform="translate(810 46)">
      <rect width="485" height="198" rx="30" fill="#171717"/>
      <g transform="translate(32 31) scale(.82)" style="color:#F4F1EA"><use href="#lower-b-core"/></g>
      <text x="196" y="120" class="word-rev">Backboard</text>
    </g>
    <g transform="translate(1350 75)" style="color:#171717">
      <g transform="translate(0 62) scale(.10)"><use href="#lower-b-core"/></g>
      <g transform="translate(54 54) scale(.15)"><use href="#lower-b-core"/></g>
      <g transform="translate(118 46) scale(.20)"><use href="#lower-b-core"/></g>
      <text x="0" y="144" class="label">16</text><text x="54" y="144" class="label">24</text><text x="118" y="144" class="label">32</text>
    </g>
  </g>

  <!-- B -->
  <g transform="translate(70 515)">
    <rect width="1460" height="290" rx="32" class="card"/>
    <text x="30" y="47" class="label">B · ORBIT CORE B</text>
    <g transform="translate(85 62)" style="color:#171717"><use href="#orbit-b-core"/></g>
    <text x="298" y="179" class="word">Backboard</text>
    <g transform="translate(810 46)">
      <rect width="485" height="198" rx="30" fill="#171717"/>
      <g transform="translate(32 31) scale(.82)" style="color:#F4F1EA"><use href="#orbit-b-core"/></g>
      <text x="196" y="120" class="word-rev">Backboard</text>
    </g>
    <g transform="translate(1350 75)" style="color:#171717">
      <g transform="translate(0 62) scale(.10)"><use href="#orbit-b-core"/></g>
      <g transform="translate(54 54) scale(.15)"><use href="#orbit-b-core"/></g>
      <g transform="translate(118 46) scale(.20)"><use href="#orbit-b-core"/></g>
      <text x="0" y="144" class="label">16</text><text x="54" y="144" class="label">24</text><text x="118" y="144" class="label">32</text>
    </g>
  </g>

  <!-- C -->
  <g transform="translate(70 840)">
    <rect width="1460" height="290" rx="32" class="card"/>
    <text x="30" y="47" class="label">C · WORDMARK / CORE PUNCTUATION</text>
    <text x="88" y="179" class="word">Backboard</text>
    <rect x="451" y="143" width="19" height="19" rx="6" fill="#6D5EFF"/>
    <text x="610" y="174" class="caps">BACKBOARD</text>
    <rect x="1001" y="137" width="18" height="18" rx="5" fill="#6D5EFF"/>
    <g transform="translate(1140 63)" style="color:#171717"><use href="#core-punctuation"/></g>
    <g transform="translate(1350 75)" style="color:#171717">
      <g transform="translate(0 62) scale(.10)"><use href="#core-punctuation"/></g>
      <g transform="translate(54 54) scale(.15)"><use href="#core-punctuation"/></g>
      <g transform="translate(118 46) scale(.20)"><use href="#core-punctuation"/></g>
      <text x="0" y="144" class="label">16</text><text x="54" y="144" class="label">24</text><text x="118" y="144" class="label">32</text>
    </g>
  </g>

  <text x="70" y="1180" class="meta">PRIMARY INK #171717 · MEMORY CORE #6D5EFF · WARM FIELD #F4F1EA</text>
</svg>
