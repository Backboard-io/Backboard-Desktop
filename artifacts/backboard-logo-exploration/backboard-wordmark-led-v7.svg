<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1500" viewBox="0 0 1600 1500">
  <rect width="1600" height="1500" fill="#F4F1EA"/>
  <style>
    .ink-fill { fill: #171717; }
    .ink-stroke { fill: none; stroke: #171717; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }
    .paper-fill { fill: #F4F1EA; }
    .card { fill: #FBF9F4; stroke: #DED8CC; stroke-width: 2; }
    .title { fill: #171717; font: 600 32px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: -0.025em; }
    .meta { fill: #918C82; font: 600 15px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 0.16em; }
    .label { fill: #918C82; font: 600 14px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 0.14em; }
    .avenir { fill: #171717; font: 560 56px "Avenir Next", Avenir, "Helvetica Neue", sans-serif; letter-spacing: -0.045em; }
    .helv { fill: #171717; font: 540 57px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: -0.052em; }
    .caps { fill: #171717; font: 620 48px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 0.065em; }
    .lower { fill: #171717; font: 560 58px "Avenir Next", Avenir, "Helvetica Neue", sans-serif; letter-spacing: -0.06em; }
    .editorial { fill: #171717; font: 600 58px Georgia, "Times New Roman", serif; letter-spacing: -0.045em; }
    .plain { fill: #171717; font: 540 64px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: -0.06em; }
  </style>

  <defs>
    <!-- A: a model plane in front of a persistent context ring -->
    <g id="ring-plane">
      <circle cx="72" cy="72" r="48" class="ink-stroke"/>
      <rect x="62" y="54" width="60" height="60" rx="18" class="paper-fill"/>
      <rect x="62" y="54" width="60" height="60" rx="18" class="ink-stroke"/>
    </g>

    <!-- B: two offset frames, one visibly behind -->
    <g id="double-frame">
      <rect x="22" y="22" width="82" height="82" rx="24" class="ink-stroke"/>
      <path d="M72 50H103C116 50 124 58 124 71V102C124 115 116 123 103 123H72C59 123 51 115 51 102V71" class="paper-fill" stroke="#171717" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- C: a literal back plane with a foreground core -->
    <g id="core-board">
      <path d="M42 24V120" class="ink-stroke"/>
      <path d="M42 42H100C113 42 122 51 122 64V82C122 95 113 104 100 104H70" class="ink-stroke"/>
      <rect x="81" y="63" width="26" height="26" rx="8" class="ink-fill"/>
    </g>

    <!-- D: foreground and back-context arcs -->
    <g id="paired-arcs">
      <path d="M106 41C94 27 75 21 57 26C34 32 20 54 24 78C28 101 48 118 72 118H105" class="ink-stroke"/>
      <path d="M38 103C50 117 69 123 87 118C110 112 124 90 120 66C116 43 96 26 72 26H39" class="ink-stroke"/>
    </g>

    <!-- E: compact back-plane diamond -->
    <g id="diamond-core">
      <rect x="29" y="29" width="86" height="86" rx="22" transform="rotate(45 72 72)" class="ink-fill"/>
      <rect x="51" y="51" width="42" height="42" rx="12" transform="rotate(45 72 72)" class="paper-fill"/>
      <rect x="65" y="65" width="14" height="14" rx="4" transform="rotate(45 72 72)" class="ink-fill"/>
    </g>
  </defs>

  <text x="70" y="72" class="title">Backboard wordmark-led studies</text>
  <text x="70" y="106" class="meta">LESS ICONOGRAPHY · MORE BRAND VOICE · ROUND 07</text>
  <line x1="70" y1="145" x2="1530" y2="145" stroke="#D6D0C4" stroke-width="2"/>

  <!-- A -->
  <g transform="translate(70 180)">
    <rect width="1460" height="190" rx="28" class="card"/>
    <text x="28" y="44" class="label">A · RING / PLANE</text>
    <g transform="translate(86 30)"><use href="#ring-plane"/></g>
    <text x="285" y="124" class="avenir">Backboard</text>
    <g transform="translate(1120 24)"><rect width="142" height="142" rx="34" fill="#171717"/><g transform="translate(0 0)" style="filter:invert(1)"><use href="#ring-plane"/></g></g>
    <g transform="translate(1320 48) scale(.52)"><use href="#ring-plane"/></g>
    <g transform="translate(1400 34) scale(.72)"><use href="#ring-plane"/></g>
  </g>

  <!-- B -->
  <g transform="translate(70 395)">
    <rect width="1460" height="190" rx="28" class="card"/>
    <text x="28" y="44" class="label">B · DOUBLE FRAME</text>
    <g transform="translate(86 30)"><use href="#double-frame"/></g>
    <text x="285" y="124" class="helv">Backboard</text>
    <g transform="translate(1120 24)"><rect width="142" height="142" rx="34" fill="#171717"/><g transform="translate(0 0)" style="filter:invert(1)"><use href="#double-frame"/></g></g>
    <g transform="translate(1320 48) scale(.52)"><use href="#double-frame"/></g>
    <g transform="translate(1400 34) scale(.72)"><use href="#double-frame"/></g>
  </g>

  <!-- C -->
  <g transform="translate(70 610)">
    <rect width="1460" height="190" rx="28" class="card"/>
    <text x="28" y="44" class="label">C · CORE / BOARD</text>
    <g transform="translate(86 30)"><use href="#core-board"/></g>
    <text x="285" y="121" class="caps">BACKBOARD</text>
    <g transform="translate(1120 24)"><rect width="142" height="142" rx="34" fill="#171717"/><g transform="translate(0 0)" style="filter:invert(1)"><use href="#core-board"/></g></g>
    <g transform="translate(1320 48) scale(.52)"><use href="#core-board"/></g>
    <g transform="translate(1400 34) scale(.72)"><use href="#core-board"/></g>
  </g>

  <!-- D -->
  <g transform="translate(70 825)">
    <rect width="1460" height="190" rx="28" class="card"/>
    <text x="28" y="44" class="label">D · PAIRED ARCS</text>
    <g transform="translate(86 30)"><use href="#paired-arcs"/></g>
    <text x="285" y="123" class="lower">backboard</text>
    <g transform="translate(1120 24)"><rect width="142" height="142" rx="34" fill="#171717"/><g transform="translate(0 0)" style="filter:invert(1)"><use href="#paired-arcs"/></g></g>
    <g transform="translate(1320 48) scale(.52)"><use href="#paired-arcs"/></g>
    <g transform="translate(1400 34) scale(.72)"><use href="#paired-arcs"/></g>
  </g>

  <!-- E -->
  <g transform="translate(70 1040)">
    <rect width="1460" height="190" rx="28" class="card"/>
    <text x="28" y="44" class="label">E · DIAMOND CORE</text>
    <g transform="translate(86 30)"><use href="#diamond-core"/></g>
    <text x="285" y="125" class="editorial">Backboard</text>
    <g transform="translate(1120 24)"><rect width="142" height="142" rx="34" fill="#171717"/><g transform="translate(0 0)" style="filter:invert(1)"><use href="#diamond-core"/></g></g>
    <g transform="translate(1320 48) scale(.52)"><use href="#diamond-core"/></g>
    <g transform="translate(1400 34) scale(.72)"><use href="#diamond-core"/></g>
  </g>

  <!-- F -->
  <g transform="translate(70 1255)">
    <rect width="1460" height="190" rx="28" class="card"/>
    <text x="28" y="44" class="label">F · WORDMARK ONLY</text>
    <text x="112" y="126" class="plain">Backboard</text>
    <circle cx="435" cy="111" r="7" class="ink-fill"/>
    <text x="840" y="124" class="caps">BACKBOARD</text>
  </g>
</svg>
