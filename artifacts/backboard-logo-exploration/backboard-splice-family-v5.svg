<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1500" viewBox="0 0 1500 1500">
  <rect width="1500" height="1500" fill="#F5F3ED"/>
  <style>
    .ink { fill: #141414; }
    .paper { fill: #F5F3ED; }
    .cell { fill: #FBFAF6; stroke: #DED9CD; stroke-width: 2; }
    .word { fill: #141414; font: 540 31px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: -0.035em; }
    .num { fill: #938F85; font: 600 15px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 0.14em; }
    .title { fill: #141414; font: 600 30px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: -0.025em; }
    .meta { fill: #938F85; font: 600 15px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 0.16em; }
  </style>

  <defs>
    <g id="splice-a">
      <rect x="72" y="15" width="16" height="130" rx="8" class="ink"/>
      <rect x="43" y="37" width="16" height="57" rx="8" class="ink" transform="rotate(-18 51 66)"/>
      <rect x="17" y="63" width="16" height="29" rx="8" class="ink" transform="rotate(-32 25 78)"/>
      <rect x="101" y="66" width="16" height="57" rx="8" class="ink" transform="rotate(-18 109 95)"/>
      <rect x="127" y="70" width="16" height="29" rx="8" class="ink" transform="rotate(-32 135 85)"/>
    </g>
    <g id="splice-b">
      <rect x="72" y="17" width="16" height="126" rx="8" class="ink"/>
      <rect x="42" y="42" width="16" height="50" rx="8" class="ink" transform="rotate(-26 50 67)"/>
      <rect x="18" y="66" width="16" height="24" rx="8" class="ink" transform="rotate(-26 26 78)"/>
      <rect x="102" y="68" width="16" height="50" rx="8" class="ink" transform="rotate(-26 110 93)"/>
      <rect x="126" y="72" width="16" height="24" rx="8" class="ink" transform="rotate(-26 134 84)"/>
    </g>
    <mask id="round-splice-mask">
      <rect width="160" height="160" fill="black"/>
      <circle cx="80" cy="80" r="67" fill="white"/>
      <g fill="black" transform="rotate(-42 80 80)">
        <rect x="72" y="17" width="16" height="126" rx="8"/>
        <rect x="47" y="43" width="16" height="56" rx="8"/>
        <rect x="22" y="68" width="16" height="24" rx="8"/>
        <rect x="97" y="61" width="16" height="56" rx="8"/>
        <rect x="122" y="68" width="16" height="24" rx="8"/>
      </g>
    </mask>
    <mask id="soft-square-splice-mask">
      <rect width="160" height="160" fill="black"/>
      <rect x="14" y="14" width="132" height="132" rx="38" fill="white"/>
      <g fill="black" transform="rotate(-42 80 80)">
        <rect x="72" y="17" width="16" height="126" rx="8"/>
        <rect x="47" y="43" width="16" height="56" rx="8"/>
        <rect x="22" y="68" width="16" height="24" rx="8"/>
        <rect x="97" y="61" width="16" height="56" rx="8"/>
        <rect x="122" y="68" width="16" height="24" rx="8"/>
      </g>
    </mask>
    <mask id="diamond-splice-mask">
      <rect width="160" height="160" fill="black"/>
      <rect x="25" y="25" width="110" height="110" rx="24" transform="rotate(45 80 80)" fill="white"/>
      <g fill="black" transform="rotate(-42 80 80)">
        <rect x="72" y="17" width="16" height="126" rx="8"/>
        <rect x="47" y="43" width="16" height="56" rx="8"/>
        <rect x="22" y="68" width="16" height="24" rx="8"/>
        <rect x="97" y="61" width="16" height="56" rx="8"/>
        <rect x="122" y="68" width="16" height="24" rx="8"/>
      </g>
    </mask>
  </defs>

  <text x="60" y="70" class="title">Backboard splice family</text>
  <text x="60" y="102" class="meta">ONE MEMORY SPINE · SIGNALS IN / CONTEXT OUT · ROUND 05</text>
  <line x1="60" y1="140" x2="1440" y2="140" stroke="#D7D2C6" stroke-width="2"/>

  <!-- 01 -->
  <g transform="translate(60 180)">
    <rect width="440" height="390" rx="30" class="cell"/>
    <g transform="translate(140 47)"><use href="#splice-a"/></g>
    <text x="220" y="278" text-anchor="middle" class="word">backboard</text>
    <text x="28" y="353" class="num">01</text>
  </g>

  <!-- 02 -->
  <g transform="translate(530 180)">
    <rect width="440" height="390" rx="30" class="cell"/>
    <g transform="translate(140 47)"><use href="#splice-b"/></g>
    <text x="220" y="278" text-anchor="middle" class="word">backboard</text>
    <text x="28" y="353" class="num">02</text>
  </g>

  <!-- 03 · Split central memory slot -->
  <g transform="translate(1000 180)">
    <rect width="440" height="390" rx="30" class="cell"/>
    <g transform="translate(140 47)">
      <rect x="72" y="14" width="16" height="52" rx="8" class="ink"/>
      <rect x="72" y="94" width="16" height="52" rx="8" class="ink"/>
      <rect x="38" y="40" width="16" height="52" rx="8" class="ink" transform="rotate(-34 46 66)"/>
      <rect x="17" y="65" width="16" height="25" rx="8" class="ink" transform="rotate(-34 25 78)"/>
      <rect x="106" y="68" width="16" height="52" rx="8" class="ink" transform="rotate(-34 114 94)"/>
      <rect x="127" y="72" width="16" height="25" rx="8" class="ink" transform="rotate(-34 135 84)"/>
      <rect x="69" y="69" width="22" height="22" rx="7" class="ink"/>
    </g>
    <text x="220" y="278" text-anchor="middle" class="word">backboard</text>
    <text x="28" y="353" class="num">03</text>
  </g>

  <!-- 04 · Diagonal parallel splice -->
  <g transform="translate(60 600)">
    <rect width="440" height="390" rx="30" class="cell"/>
    <g transform="translate(140 47) rotate(-42 80 80)">
      <rect x="72" y="15" width="16" height="130" rx="8" class="ink"/>
      <rect x="46" y="39" width="16" height="64" rx="8" class="ink"/>
      <rect x="20" y="68" width="16" height="26" rx="8" class="ink"/>
      <rect x="98" y="57" width="16" height="64" rx="8" class="ink"/>
      <rect x="124" y="68" width="16" height="26" rx="8" class="ink"/>
    </g>
    <text x="220" y="278" text-anchor="middle" class="word">backboard</text>
    <text x="28" y="353" class="num">04</text>
  </g>

  <!-- 05 · Three-bar reduction -->
  <g transform="translate(530 600)">
    <rect width="440" height="390" rx="30" class="cell"/>
    <g transform="translate(140 47) rotate(-42 80 80)">
      <rect x="72" y="14" width="18" height="132" rx="9" class="ink"/>
      <rect x="39" y="53" width="18" height="54" rx="9" class="ink"/>
      <rect x="105" y="53" width="18" height="54" rx="9" class="ink"/>
    </g>
    <text x="220" y="278" text-anchor="middle" class="word">backboard</text>
    <text x="28" y="353" class="num">05</text>
  </g>

  <!-- 06 · Paired diagonal gates -->
  <g transform="translate(1000 600)">
    <rect width="440" height="390" rx="30" class="cell"/>
    <g transform="translate(140 47)">
      <rect x="28" y="25" width="17" height="65" rx="8.5" class="ink" transform="rotate(-38 36.5 57.5)"/>
      <rect x="52" y="45" width="17" height="65" rx="8.5" class="ink" transform="rotate(-38 60.5 77.5)"/>
      <rect x="91" y="50" width="17" height="65" rx="8.5" class="ink" transform="rotate(-38 99.5 82.5)"/>
      <rect x="115" y="70" width="17" height="65" rx="8.5" class="ink" transform="rotate(-38 123.5 102.5)"/>
    </g>
    <text x="220" y="278" text-anchor="middle" class="word">backboard</text>
    <text x="28" y="353" class="num">06</text>
  </g>

  <!-- 07 · Round back plane -->
  <g transform="translate(60 1020)">
    <rect width="440" height="390" rx="30" class="cell"/>
    <g transform="translate(140 47)">
      <rect width="160" height="160" class="ink" mask="url(#round-splice-mask)"/>
    </g>
    <text x="220" y="278" text-anchor="middle" class="word">backboard</text>
    <text x="28" y="353" class="num">07</text>
  </g>

  <!-- 08 · Soft-square back plane -->
  <g transform="translate(530 1020)">
    <rect width="440" height="390" rx="30" class="cell"/>
    <g transform="translate(140 47)">
      <rect width="160" height="160" class="ink" mask="url(#soft-square-splice-mask)"/>
    </g>
    <text x="220" y="278" text-anchor="middle" class="word">backboard</text>
    <text x="28" y="353" class="num">08</text>
  </g>

  <!-- 09 · Diamond back plane -->
  <g transform="translate(1000 1020)">
    <rect width="440" height="390" rx="30" class="cell"/>
    <g transform="translate(140 47)">
      <rect width="160" height="160" class="ink" mask="url(#diamond-splice-mask)"/>
    </g>
    <text x="220" y="278" text-anchor="middle" class="word">backboard</text>
    <text x="28" y="353" class="num">09</text>
  </g>

  <text x="60" y="1450" class="meta">OPEN MARKS 01–06 · BACK-PLANE MARKS 07–09</text>
</svg>
