<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1500" viewBox="0 0 1500 1500">
  <rect width="1500" height="1500" fill="#F6F4EE"/>
  <style>
    .ink { fill: #151515; }
    .white { fill: #F6F4EE; }
    .cell { fill: #FBFAF6; stroke: #E0DCD1; stroke-width: 2; }
    .word { fill: #151515; font: 540 31px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: -0.035em; }
    .num { fill: #928E84; font: 600 15px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 0.14em; }
    .title { fill: #151515; font: 600 30px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: -0.025em; }
    .meta { fill: #928E84; font: 600 15px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 0.16em; }
  </style>

  <defs>
    <mask id="circle-bars">
      <rect width="160" height="160" fill="black"/>
      <circle cx="80" cy="80" r="67" fill="white"/>
      <rect x="72" y="27" width="16" height="106" rx="8" fill="black"/>
      <rect x="47" y="49" width="16" height="53" rx="8" fill="black"/>
      <rect x="22" y="69" width="16" height="22" rx="8" fill="black"/>
      <rect x="97" y="58" width="16" height="53" rx="8" fill="black"/>
      <rect x="122" y="69" width="16" height="22" rx="8" fill="black"/>
    </mask>
    <mask id="hex-bars">
      <rect width="160" height="160" fill="black"/>
      <path d="M80 10L139 44V116L80 150L21 116V44Z" fill="white"/>
      <rect x="72" y="31" width="16" height="98" rx="8" fill="black"/>
      <rect x="47" y="50" width="16" height="48" rx="8" fill="black"/>
      <rect x="22" y="70" width="16" height="20" rx="8" fill="black"/>
      <rect x="97" y="62" width="16" height="48" rx="8" fill="black"/>
      <rect x="122" y="70" width="16" height="20" rx="8" fill="black"/>
    </mask>
  </defs>

  <text x="60" y="70" class="title">Backboard signal family</text>
  <text x="60" y="102" class="meta">EVOLVING THE EXISTING MEMORY-BAR EQUITY · ROUND 04</text>
  <line x1="60" y1="140" x2="1440" y2="140" stroke="#D7D2C6" stroke-width="2"/>

  <!-- 01 · Compact waveform -->
  <g transform="translate(60 180)">
    <rect width="440" height="390" rx="30" class="cell"/>
    <g transform="translate(140 48)">
      <rect x="14" y="68" width="16" height="24" rx="8" class="ink"/>
      <rect x="42" y="54" width="16" height="52" rx="8" class="ink"/>
      <rect x="70" y="36" width="16" height="88" rx="8" class="ink"/>
      <rect x="98" y="12" width="16" height="136" rx="8" class="ink"/>
      <rect x="126" y="36" width="16" height="88" rx="8" class="ink"/>
      <rect x="154" y="54" width="16" height="52" rx="8" class="ink"/>
      <rect x="182" y="68" width="16" height="24" rx="8" class="ink"/>
    </g>
    <text x="220" y="278" text-anchor="middle" class="word">backboard</text>
    <text x="28" y="353" class="num">01</text>
  </g>

  <!-- 02 · Original staircase, compacted -->
  <g transform="translate(530 180)">
    <rect width="440" height="390" rx="30" class="cell"/>
    <g transform="translate(140 48)">
      <rect x="72" y="15" width="16" height="130" rx="8" class="ink"/>
      <rect x="46" y="38" width="16" height="65" rx="8" class="ink"/>
      <rect x="20" y="68" width="16" height="26" rx="8" class="ink"/>
      <rect x="98" y="57" width="16" height="65" rx="8" class="ink"/>
      <rect x="124" y="68" width="16" height="26" rx="8" class="ink"/>
    </g>
    <text x="220" y="278" text-anchor="middle" class="word">backboard</text>
    <text x="28" y="353" class="num">02</text>
  </g>

  <!-- 03 · Two-sided memory fan -->
  <g transform="translate(1000 180)">
    <rect width="440" height="390" rx="30" class="cell"/>
    <g transform="translate(140 48)">
      <rect x="72" y="17" width="16" height="126" rx="8" class="ink"/>
      <rect x="39" y="36" width="16" height="54" rx="8" class="ink" transform="rotate(-18 47 63)"/>
      <rect x="13" y="60" width="16" height="28" rx="8" class="ink" transform="rotate(-34 21 74)"/>
      <rect x="105" y="70" width="16" height="54" rx="8" class="ink" transform="rotate(-18 113 97)"/>
      <rect x="131" y="72" width="16" height="28" rx="8" class="ink" transform="rotate(-34 139 86)"/>
    </g>
    <text x="220" y="278" text-anchor="middle" class="word">backboard</text>
    <text x="28" y="353" class="num">03</text>
  </g>

  <!-- 04 · Rotated signal splice -->
  <g transform="translate(60 600)">
    <rect width="440" height="390" rx="30" class="cell"/>
    <g transform="translate(140 48) rotate(-42 80 80)">
      <rect x="72" y="16" width="16" height="128" rx="8" class="ink"/>
      <rect x="46" y="39" width="16" height="64" rx="8" class="ink"/>
      <rect x="20" y="68" width="16" height="25" rx="8" class="ink"/>
      <rect x="98" y="57" width="16" height="64" rx="8" class="ink"/>
      <rect x="124" y="68" width="16" height="25" rx="8" class="ink"/>
    </g>
    <text x="220" y="278" text-anchor="middle" class="word">backboard</text>
    <text x="28" y="353" class="num">04</text>
  </g>

  <!-- 05 · Horizontal context wings -->
  <g transform="translate(530 600)">
    <rect width="440" height="390" rx="30" class="cell"/>
    <g transform="translate(140 48)">
      <rect x="72" y="19" width="16" height="122" rx="8" class="ink"/>
      <rect x="18" y="46" width="58" height="16" rx="8" class="ink"/>
      <rect x="38" y="72" width="38" height="16" rx="8" class="ink"/>
      <rect x="84" y="98" width="58" height="16" rx="8" class="ink"/>
      <rect x="84" y="72" width="38" height="16" rx="8" class="ink"/>
    </g>
    <text x="220" y="278" text-anchor="middle" class="word">backboard</text>
    <text x="28" y="353" class="num">05</text>
  </g>

  <!-- 06 · Asymmetric memory burst -->
  <g transform="translate(1000 600)">
    <rect width="440" height="390" rx="30" class="cell"/>
    <g transform="translate(140 48)">
      <rect x="72" y="13" width="16" height="54" rx="8" class="ink"/>
      <rect x="72" y="93" width="16" height="54" rx="8" class="ink"/>
      <rect x="22" y="72" width="44" height="16" rx="8" class="ink"/>
      <rect x="94" y="72" width="44" height="16" rx="8" class="ink"/>
      <rect x="38" y="37" width="16" height="42" rx="8" class="ink" transform="rotate(-45 46 58)"/>
      <rect x="106" y="81" width="16" height="42" rx="8" class="ink" transform="rotate(-45 114 102)"/>
      <rect x="70" y="70" width="20" height="20" rx="6" class="ink"/>
    </g>
    <text x="220" y="278" text-anchor="middle" class="word">backboard</text>
    <text x="28" y="353" class="num">06</text>
  </g>

  <!-- 07 · Single stepped memory path -->
  <g transform="translate(60 1020)">
    <rect width="440" height="390" rx="30" class="cell"/>
    <g transform="translate(140 48)">
      <path d="M17 81H39V57H62V33H80V127H98V103H121V81H143" fill="none" stroke="#151515" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="220" y="278" text-anchor="middle" class="word">backboard</text>
    <text x="28" y="353" class="num">07</text>
  </g>

  <!-- 08 · Signal knocked out of a disc -->
  <g transform="translate(530 1020)">
    <rect width="440" height="390" rx="30" class="cell"/>
    <g transform="translate(140 48)">
      <rect width="160" height="160" class="ink" mask="url(#circle-bars)"/>
    </g>
    <text x="220" y="278" text-anchor="middle" class="word">backboard</text>
    <text x="28" y="353" class="num">08</text>
  </g>

  <!-- 09 · Signal knocked out of a back plane -->
  <g transform="translate(1000 1020)">
    <rect width="440" height="390" rx="30" class="cell"/>
    <g transform="translate(140 48)">
      <rect width="160" height="160" class="ink" mask="url(#hex-bars)"/>
    </g>
    <text x="220" y="278" text-anchor="middle" class="word">backboard</text>
    <text x="28" y="353" class="num">09</text>
  </g>

  <text x="60" y="1450" class="meta">MONOCHROME FIRST · NO .IO IN THE PRIMARY WORDMARK</text>
</svg>
